version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: multiv-api-mongodb-prod
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_NAME:-multiv_api}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - multiv-api-network
    # Remove volumes in production for security
    # volumes:
    #   - /var/lib/mongodb/data:/data/db

  # Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: multiv-api-app-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      CORS: ${CORS}
      DB_USER: ${DB_USER:-testing_db}
      DB_PASSWORD: ${DB_PASSWORD:-XqfMFUboVylFKHie}
      DB_HOST: ${DB_HOST:-cluster0.2zmxz.mongodb.net}
      DB_NAME: ${DB_NAME:-data_viandas}
      JWT_SECRET: ${JWT_SECRET:-GfdCcruWGyGuTfC4d0JJ}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
    ports:
      - "${PORT:-3000}:3000"
    # Using MongoDB Atlas - no local dependency needed
    # depends_on:
    #   - mongodb
    networks:
      - multiv-api-network
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: multiv-api-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - multiv-api-network

volumes:
  mongodb_data:
    driver: local

networks:
  multiv-api-network:
    driver: bridge